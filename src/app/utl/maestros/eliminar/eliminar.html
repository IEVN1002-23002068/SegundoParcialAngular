<div class="min-h-screen flex justify-center items-center bg-gray-50 p-4">

  <div class="bg-white block max-w-sm w-full p-6 border border-gray-200 rounded-lg shadow-sm">

    <img class="rounded-lg w-full h-auto object-cover" src="/img/user.avif" alt="Maestro" />

    <h5 class="mt-6 mb-2 text-2xl font-semibold tracking-tight text-gray-900">
      ID {{ regMaestro.idmaestro }}
    </h5>

    <p class="mb-2 text-gray-600">
      Nombre: {{ regMaestro.nombre }} | Apaterno: {{ regMaestro.apaterno }}
    </p>
    <p class="mb-2 text-gray-600">
      Amaterno: {{ regMaestro.amaterno }}
    </p>
    <p class="mb-4 text-gray-600">
      Correo: {{ regMaestro.correo }}
    </p>

    <div class="flex gap-2">
      <button
        type="button"
        (click)="eliminar()"
        class="rounded-lg bg-red-700 px-4 py-2.5 text-sm font-medium text-white hover:bg-red-800 focus:outline-none focus:ring-4 focus:ring-red-300">
        Eliminar
      </button>

      <button
        type="button"
        [routerLink]="['/utl/maestros']"
        class="rounded-lg bg-gray-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-gray-300">
        Cancelar
      </button>
    </div>

  </div>
</div>
